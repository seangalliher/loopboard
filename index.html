<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LoopBoard</title>
    <script>
      // Sets the theme before the first paint; src/ui/theme.ts keeps it up to date afterwards.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('loopboard:theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
